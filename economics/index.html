<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economics - NEXO</title>
<script src="../nexo-api.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060906;--surface:#0c110c;--surface-hover:#141c14;
  --text:#e0f0e0;--text-dim:#90b090;--text-muted:#6a8a6a;
  --green:#2ea84c;--green-light:#4cd96b;--green-dim:#1a5c2a;
  --teal:#2aaf8f;--teal-light:#4cdbb8;--teal-dim:#1a6a55;
  --amber:#d4a040;--amber-light:#e8c060;--amber-dim:#7a5a1a;
  --purple:#8a5abe;--purple-light:#b07ae0;--purple-dim:#5a2a8a;
  --rose:#d4606a;
  --border:#182218;
  --transition:0.5s cubic-bezier(.22,1,.36,1);
  --gradient-teal:linear-gradient(135deg, #2aaf8f, #4cdbb8);
  --gradient-wide:linear-gradient(135deg, #2ea84c, #4cd96b, #2aaf8f);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  overflow-x:hidden;cursor:default;padding-top:52px;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--teal-dim);border-radius:3px}
.light-mode{--bg:#f5f8f5;--surface:#eaf1ea;--surface-hover:#dfe8df;--text:#1a3a1a;--text-dim:#4a7a4a;--text-muted:#7aaa7a;--border:#c8d8c8}
.light-mode .navbar{background:rgba(244,247,244,0.85);border-bottom-color:var(--border)}
.light-mode .hub-card,.light-mode .stat-box{background:#e8efe8}
.light-mode .hub-card:hover{background:#dce6dc}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 30% 20%, rgba(46,168,76,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(42,175,143,0.02) 0%, transparent 45%);
  pointer-events:none;z-index:0;
}
/* Navbar */
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:900;
  height:52px;
  background:rgba(6,9,6,0.85);backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  border-bottom:1px solid rgba(24,34,24,0.8);
  padding:0 2rem;
  display:flex;align-items:center;justify-content:space-between;
}
.navbar-brand{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
.navbar-logo{
  font-size:1.1rem;font-weight:800;letter-spacing:0.06em;
  background:var(--gradient-wide);background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.navbar-version{
  display:inline-block;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--teal);border:1px solid var(--teal-dim);
  padding:1px 8px;line-height:1.4;margin-top:1px;
}
.navbar-back{
  font-size:0.78rem;color:var(--text-dim);letter-spacing:0.03em;
  text-decoration:none;display:flex;align-items:center;gap:6px;
  transition:color 150ms;
}
.navbar-back:hover{color:var(--teal)}
.navbar-back svg{width:14px;height:14px;}
.navbar-actions{display:flex;gap:4px;align-items:center;}
.theme-btn{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-dim);transition:color 150ms;
}
.theme-btn svg{width:18px;height:18px;}
.theme-btn:hover{color:var(--text)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradientShift{0%,100%{background-position:0% center}50%{background-position:200% center}}
/* Hero */
.hero{
  position:relative;z-index:1;padding:4rem 2rem 3rem;
  text-align:center;
}
.hero .accent-line{
  width:40px;height:2px;margin:0 auto 1.5rem;
  background:var(--gradient-wide);background-size:200% auto;
}
.hero h1{
  font-size:clamp(2.5rem, 8vw, 4rem);font-weight:800;letter-spacing:-1px;line-height:1;
  background:var(--gradient-teal);background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero .subtitle{font-size:1rem;color:var(--text-dim);margin-top:0.5rem;font-weight:300;}
.hero .desc{color:var(--text-muted);font-size:0.85rem;max-width:500px;margin:0.8rem auto 0;line-height:1.7;}
.container{max-width:1000px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1;}
/* Progress bar */
.progress-section{margin-bottom:2rem;animation:fadeUp 0.5s ease;}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;}
.progress-label{font-size:0.8rem;color:var(--text-dim);letter-spacing:0.5px;}
.progress-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;background:var(--gradient-teal);background-size:200% auto;width:0%;transition:width 0.8s cubic-bezier(.22,1,.36,1);}
/* Search */
.search-wrapper{position:relative;max-width:320px;margin:0 auto 1.5rem;}
.search-wrapper svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted);}
.search-bar{
  width:100%;padding:9px 14px 9px 34px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-size:0.85rem;outline:none;font-family:inherit;
  transition:border-color var(--transition);
}
.search-bar:focus{border-color:var(--teal-dim);box-shadow:0 0 0 3px rgba(42,175,143,0.08);}
.search-bar::placeholder{color:var(--text-muted);}
/* Hub card grid */
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0.8rem;}
.hub-card{
  background:var(--surface);border:1px solid var(--border);
  padding:1.2rem 1.5rem;text-decoration:none;color:inherit;
  transition:all var(--transition);position:relative;
}
.hub-card:hover{background:var(--surface-hover);border-color:var(--teal-dim);transform:translateY(-2px);}
.hub-card .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.3rem;}
.hub-card .lesson-num{
  font-size:0.6rem;font-weight:700;color:var(--text-muted);
  letter-spacing:1px;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--border);
}
.hub-card h3{font-size:0.95rem;font-weight:600;padding-right:0.5rem;}
.hub-card .desc{color:var(--text-dim);font-size:0.78rem;line-height:1.4;margin-top:0.2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hub-card .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem;}
.hub-card .status-dot{
  font-size:0.6rem;letter-spacing:0.5px;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--border);color:var(--text-muted);
}
.hub-card .status-dot.done{border-color:var(--teal-dim);color:var(--teal);}
.hub-card .status-dot.in-progress{border-color:var(--amber-dim);color:var(--amber);}
.hub-card .open-btn{
  padding:5px 14px;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;
  border:1px solid var(--teal-dim);background:transparent;color:var(--teal);
  cursor:pointer;font-family:inherit;text-decoration:none;transition:all var(--transition);
}
.hub-card .open-btn:hover{background:var(--teal-dim);color:var(--text);}
.hub-card .quiz-badge{
  font-size:0.55rem;letter-spacing:0.5px;
  padding:2px 6px;border:1px solid var(--purple-dim);color:var(--purple-light);margin-left:0.5rem;
}
.hub-card.hidden{display:none;}
@keyframes appear{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.hub-card{animation:appear 0.4s ease forwards;}
@media(max-width:640px){
  .navbar{padding:0 1rem;}
  .hub-grid{grid-template-columns:1fr;}
  .container{padding:0 1rem 2rem;}
  .hero{padding:3rem 1rem 2rem;}
}
</style>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <span class="navbar-logo">NEXO</span>
    <span class="navbar-version">Hub</span>
  </a>
  <a class="navbar-back" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to NEXO
  </a>
  <div class="navbar-actions">
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleBgMode()" aria-label="Toggle background">
      <svg id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="accent-line"></div>
  <h1>Economics</h1>
  <p class="subtitle">12 Lessons &middot; Macroeconomics &amp; Microeconomics</p>
  <p class="desc">Fundamentals of economic theory, market mechanisms, government policy, and the Sri Lankan economy — covering both micro and macroeconomic concepts across 12 comprehensive lessons.</p>
</section>

<div class="container">
  <div class="progress-section" id="progressSection">
    <div class="progress-header">
      <span class="progress-label" id="progressLabel">0 / 12 lessons completed</span>
      <span class="progress-label" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div class="search-wrapper">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-bar" id="searchInput" placeholder="Search lessons..." aria-label="Search lessons">
  </div>

  <div class="hub-grid" id="lessonGrid"></div>
</div>

<script>
const LESSONS = [
  {id:1, title:'Introduction to Economics', desc:'Fundamental concepts — scarcity, choice, opportunity cost, PPC, and basic economic questions.'},
  {id:2, title:'Demand, Supply & Market Equilibrium', desc:'Laws of demand and supply, equilibrium, elasticity, and price determination in markets.'},
  {id:3, title:'Government Intervention in Markets', desc:'Price controls, taxes, subsidies, and effects of government intervention on market outcomes.'},
  {id:4, title:'Production, Cost & Market Structures', desc:'Production functions, costs, economies of scale, and market structures from competition to monopoly.'},
  {id:5, title:'National Accounting', desc:'GDP measurement, national income accounting, circular flow of income, and its limitations.'},
  {id:6, title:'Macroeconomic Concepts', desc:'Aggregate demand/supply, business cycles, unemployment, and macroeconomic policy framework.'},
  {id:7, title:'Price, Inflation, Money & Financial System', desc:'Price indices, inflation, money, financial intermediation, and monetary policy tools.'},
  {id:8, title:'Market Failure, Government & Public Finance', desc:'Externalities, public goods, taxation, government spending, and fiscal policy.'},
  {id:9, title:'Protectionism & Foreign Investments', desc:'Trade barriers, protectionism, FDI, multinational corporations, and global trade dynamics.'},
  {id:10, title:'Foreign Exchange & Balance of Payments', desc:'Exchange rates, balance of payments, currency markets, and international capital flows.'},
  {id:11, title:'Economic Growth, Development & Labour', desc:'Growth sources, development indicators, labor markets, and human capital theory.'},
  {id:12, title:'Sri Lankan Economy Post-Independence', desc:'Evolution of Sri Lanka\'s economy from independence to present — policy shifts and challenges.'}
];
const SUBJECT_PREFIX = 'econ';

function loadLessonStatus(id) {
  try { return localStorage.getItem('nexo_lesson_' + SUBJECT_PREFIX + '-' + id) || 'not-started'; } catch(e) { return 'not-started'; }
}
function loadQuizBest(id) {
  try { return parseInt(localStorage.getItem('nexo_quiz_' + SUBJECT_PREFIX + '_' + id + '_best')) || 0; } catch(e) { return 0; }
}

function render() {
  const grid = document.getElementById('lessonGrid');
  const completed = LESSONS.filter(l => loadLessonStatus(l.id) === 'done').length;
  const total = LESSONS.length;
  const pct = Math.round((completed / total) * 100);

  document.getElementById('progressLabel').textContent = completed + ' / ' + total + ' lessons completed';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  const searchVal = (document.getElementById('searchInput').value || '').toLowerCase();

  grid.innerHTML = LESSONS.map(l => {
    const status = loadLessonStatus(l.id);
    const best = loadQuizBest(l.id);
    const statusClass = status === 'done' ? 'done' : status === 'in-progress' ? 'in-progress' : '';
    const statusLabel = status === 'done' ? 'Done' : status === 'in-progress' ? 'In Progress' : 'Not Started';
    const qBadge = best > 0 ? '<span class="quiz-badge">Quiz: ' + best + '%</span>' : '';
    const hide = searchVal && !l.title.toLowerCase().includes(searchVal) && !l.desc.toLowerCase().includes(searchVal);
    return '<a class="hub-card' + (hide ? ' hidden' : '') + '" href="lessons/' + l.id + '/index.html">' +
      '<div class="card-top">' +
        '<span class="lesson-num">Lesson ' + l.id + '</span>' +
        (qBadge ? qBadge : '') +
      '</div>' +
      '<h3>' + l.title + '</h3>' +
      '<div class="desc">' + l.desc + '</div>' +
      '<div class="card-footer">' +
        '<span class="status-dot ' + statusClass + '">' + statusLabel + '</span>' +
        '<span class="open-btn">Open &rarr;</span>' +
      '</div>' +
    '</a>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', render);
render();

/* Theme system */
function loadBgMode() {
  try { const v = localStorage.getItem('nexo_bg_mode'); if (v === 'light' || v === 'dark') return v; } catch(e) {}
  return 'dark';
}
function saveBgMode(mode) { localStorage.setItem('nexo_bg_mode', mode); }
function applyBgMode(mode) {
  const isLight = mode === 'light';
  document.body.classList.toggle('light-mode', isLight);
  const icon = document.getElementById('themeToggleIcon');
  if (icon) {
    icon.innerHTML = isLight
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}
applyBgMode(loadBgMode());
function toggleBgMode() { const c = loadBgMode(); const n = c === 'light' ? 'dark' : 'light'; saveBgMode(n); applyBgMode(n); }
</script>
</body>
</html>
