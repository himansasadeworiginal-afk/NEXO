<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Library - NEXO</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060906;--surface:#0c110c;--surface-hover:#141c14;
  --text:#e0f0e0;--text-dim:#90b090;--text-muted:#6a8a6a;
  --green:#2ea84c;--green-light:#4cd96b;--green-dim:#1a5c2a;
  --teal:#2aaf8f;--teal-light:#4cdbb8;--teal-dim:#1a6a55;
  --amber:#d4a040;--amber-light:#e8c060;--amber-dim:#7a5a1a;
  --purple:#8a5abe;--purple-light:#b07ae0;--purple-dim:#5a2a8a;
  --rose:#d4606a;
  --border:#182218;
  --transition:0.5s cubic-bezier(.22,1,.36,1);
  --gradient-amber:linear-gradient(135deg, #d4a040, #e8c060);
  --gradient-wide:linear-gradient(135deg, #2ea84c, #4cd96b, #d4a040);
  --gradient-green:linear-gradient(135deg, #2ea84c, #4cd96b);
  --gradient-teal:linear-gradient(135deg, #2aaf8f, #4cdbb8);
  --gradient-purple:linear-gradient(135deg, #8a5abe, #b07ae0);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  overflow-x:hidden;cursor:default;padding-top:52px;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--amber-dim);border-radius:3px}
.light-mode{--bg:#f5f8f5;--surface:#eaf1ea;--surface-hover:#dfe8df;--text:#1a3a1a;--text-dim:#4a7a4a;--text-muted:#7aaa7a;--border:#c8d8c8}
.light-mode .navbar{background:rgba(244,247,244,0.85);border-bottom-color:var(--border)}
.light-mode .card,.light-mode .stat-box{background:#e8efe8}
.light-mode .card:hover{background:#dce6dc}
body::before{
  content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(ellipse at 30% 20%, rgba(212,160,64,0.03) 0%, transparent 50%);
  pointer-events:none;z-index:0;
}
.navbar{
  position:fixed;top:0;left:0;right:0;z-index:900;
  height:52px;background:rgba(6,9,6,0.85);backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  border-bottom:1px solid rgba(24,34,24,0.8);
  padding:0 2rem;display:flex;align-items:center;justify-content:space-between;
}
.navbar-brand{display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;}
.navbar-logo{
  font-size:1.1rem;font-weight:800;letter-spacing:0.06em;
  background:var(--gradient-wide);background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.navbar-version{
  display:inline-block;font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--amber);border:1px solid var(--amber-dim);
  padding:1px 8px;line-height:1.4;margin-top:1px;
}
.navbar-back{
  font-size:0.78rem;color:var(--text-dim);letter-spacing:0.03em;
  text-decoration:none;display:flex;align-items:center;gap:6px;transition:color 150ms;
}
.navbar-back:hover{color:var(--amber)}
.navbar-back svg{width:14px;height:14px;}
.navbar-actions{display:flex;gap:4px;align-items:center;}
.theme-btn{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;color:var(--text-dim);transition:color 150ms;
}
.theme-btn svg{width:18px;height:18px;}
.theme-btn:hover{color:var(--text)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes gradientShift{0%,100%{background-position:0% center}50%{background-position:200% center}}
@keyframes appear{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.hero{position:relative;z-index:1;padding:4rem 2rem 2rem;text-align:center;}
.hero .accent-line{width:40px;height:2px;margin:0 auto 1.5rem;background:var(--gradient-wide);background-size:200% auto;}
.hero h1{
  font-size:clamp(2.5rem, 8vw, 4rem);font-weight:800;letter-spacing:-1px;line-height:1;
  background:var(--gradient-amber);background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.hero .subtitle{font-size:1rem;color:var(--text-dim);margin-top:0.5rem;font-weight:300;}
.hero .desc{color:var(--text-muted);font-size:0.85rem;max-width:500px;margin:0.8rem auto 0;line-height:1.7;}
.container{max-width:1100px;margin:0 auto;padding:0 2rem 3rem;position:relative;z-index:1;}
.controls-row{display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:1.2rem;}
.filter-btn{
  padding:6px 16px;background:transparent;border:1px solid var(--border);
  color:var(--text-dim);font-size:0.78rem;cursor:pointer;transition:all var(--transition);
  font-family:inherit;letter-spacing:0.3px;
}
.filter-btn:hover{border-color:var(--amber-dim);color:var(--text);transform:translateY(-1px);}
.filter-btn.active{color:#060906;font-weight:600;border-color:var(--amber);background:var(--amber);}
.search-wrapper{position:relative;display:inline-block;min-width:220px;max-width:320px;}
.search-wrapper svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-muted);}
.search-bar{
  width:100%;padding:9px 14px 9px 34px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);font-size:0.85rem;outline:none;font-family:inherit;
  transition:border-color var(--transition);
}
.search-bar:focus{border-color:var(--amber-dim);box-shadow:0 0 0 3px rgba(212,160,64,0.08);}
.search-bar::placeholder{color:var(--text-muted);}
.result-count{color:var(--text-dim);font-size:0.8rem;text-align:center;margin-bottom:1rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0.8rem;}
.card{
  background:var(--surface);border:1px solid var(--border);padding:1.5rem;
  text-decoration:none;color:inherit;transition:all var(--transition);
  position:relative;overflow:hidden;
}
.card:hover{background:var(--surface-hover);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.5);}
.card .card-accent{position:absolute;top:0;left:0;right:0;height:2px;background-size:200% auto;transform:scaleX(0);transform-origin:left;transition:transform 0.5s var(--transition);}
.card[data-filter="productivity"] .card-accent{background:var(--gradient-green);}
.card[data-filter="philosophy"] .card-accent{background:var(--gradient-teal);}
.card[data-filter="psychology"] .card-accent{background:var(--gradient-purple);}
.card[data-filter="power"] .card-accent{background:var(--gradient-amber);}
.card[data-filter="finance"] .card-accent{background:var(--gradient-amber);}
.card:hover .card-accent{transform:scaleX(1);}
.card[data-filter="productivity"]:hover{border-color:var(--green-dim);}
.card[data-filter="philosophy"]:hover{border-color:var(--teal-dim);}
.card[data-filter="psychology"]:hover{border-color:var(--purple-dim);}
.card[data-filter="power"]:hover{border-color:var(--amber-dim);}
.card[data-filter="finance"]:hover{border-color:var(--amber-dim);}
.card .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.3rem;}
.card h3{font-size:1rem;font-weight:600;line-height:1.3;padding-right:0.5rem;}
.card .badge{
  font-size:0.55rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:2px 8px;white-space:nowrap;border:1px solid var(--border);color:var(--text-muted);flex-shrink:0;
}
.card[data-filter="power"] .badge{border-color:#6a4e1a;color:var(--amber);}
.card[data-filter="productivity"] .badge{border-color:var(--green-dim);color:var(--green);}
.card[data-filter="philosophy"] .badge{border-color:var(--teal-dim);color:var(--teal);}
.card[data-filter="psychology"] .badge{border-color:#4a2a6a;color:var(--purple-light);}
.card[data-filter="finance"] .badge{border-color:#6a5a1a;color:var(--amber);}
.card .author{color:var(--text-muted);font-size:0.78rem;margin-bottom:0.5rem;letter-spacing:0.3px;}
.card .desc{color:var(--text-dim);font-size:0.8rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem;}
.open-hint{display:inline-flex;align-items:center;gap:0.4rem;font-size:0.65rem;text-transform:uppercase;letter-spacing:1.5px;transition:all var(--transition);color:var(--amber-dim);}
.card:hover .open-hint{letter-spacing:2px;color:var(--amber);}
.card.hidden{display:none;}
.card{animation:appear 0.4s ease forwards;}
@media(max-width:640px){
  .navbar{padding:0 1rem;}
  .grid{grid-template-columns:1fr;}
  .container{padding:0 1rem 2rem;}
  .hero{padding:3rem 1rem 2rem;}
}
</style>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" href="../index.html">
    <span class="navbar-logo">NEXO</span>
    <span class="navbar-version">Hub</span>
  </a>
  <a class="navbar-back" href="../index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to NEXO
  </a>
  <div class="navbar-actions">
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleBgMode()" aria-label="Toggle background">
      <svg id="themeToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="accent-line"></div>
  <h1>Book Library</h1>
  <p class="subtitle">24 Books &middot; Summaries &amp; Key Insights</p>
  <p class="desc">Curated summaries of the most influential books on productivity, philosophy, psychology, power, and finance — each condensed into actionable insights.</p>
</section>

<div class="container">
  <div class="controls-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="productivity">Productivity</button>
    <button class="filter-btn" data-filter="philosophy">Philosophy</button>
    <button class="filter-btn" data-filter="psychology">Psychology</button>
    <button class="filter-btn" data-filter="power">Power</button>
    <button class="filter-btn" data-filter="finance">Finance</button>
    <div class="search-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-bar" id="search" placeholder="Search title or author...">
    </div>
  </div>
  <div class="result-count" id="count">24 resources</div>
  <div class="grid" id="grid"></div>
</div>

<script>
const BOOKS = [
  {id:"01", title:"The 48 Laws of Power", author:"Robert Greene", path:"48-laws-of-power/index.html", desc:"The essential guide to the mechanics of power — how to acquire it, defend it, and wield it without falling victim.", filter:"power"},
  {id:"02", title:"Atomic Habits", author:"James Clear", path:"atomic-habits/index.html", desc:"Tiny changes, remarkable results. The science of building good habits and breaking bad ones.", filter:"productivity"},
  {id:"03", title:"Building a Second Brain", author:"Tiago Forte", path:"building-a-second-brain/index.html", desc:"A proven method to organize your digital life and unlock your creative potential.", filter:"productivity"},
  {id:"04", title:"Deep Work", author:"Cal Newport", path:"deep-work/index.html", desc:"Rules for focused success in a distracted world — why deep concentration is the superpower of the 21st century.", filter:"productivity"},
  {id:"05", title:"Ego Is the Enemy", author:"Ryan Holiday", path:"ego-is-the-enemy/index.html", desc:"The battle against ego — in ambition, success, and failure. Why humility is the ultimate strategy.", filter:"philosophy"},
  {id:"06", title:"Hyperfocus", author:"Chris Bailey", path:"hyperfocus/index.html", desc:"How to manage your attention in a world of distraction and be more productive.", filter:"productivity"},
  {id:"07", title:"Money Unlocked", author:"John Lee", path:"money-unlocked/index.html", desc:"Break free from limiting beliefs about money and unlock your financial potential.", filter:"finance"},
  {id:"08", title:"The Power of Now", author:"Eckhart Tolle", path:"power-of-now/index.html", desc:"The ultimate guide to spiritual enlightenment through living in the present moment.", filter:"philosophy"},
  {id:"09", title:"Psycho-Cybernetics", author:"Maxwell Maltz", path:"psycho-cybernetics/index.html", desc:"Your self-image determines your success — rewiring your brain for achievement.", filter:"psychology"},
  {id:"10", title:"The Changing World Order", author:"Ray Dalio", path:"the-changing-world-order/index.html", desc:"Why nations succeed and fail — the big cycles that explain the past, present, and future of global power.", filter:"finance"},
  {id:"11", title:"What Every BODY Is Saying", author:"Joe Navarro", path:"what-every-body-is-saying/index.html", desc:"An ex-FBI agent's guide to speed-reading people through nonverbal communication.", filter:"psychology"},
  {id:"12", title:"Book of Wisdom", author:"Harry B. Joseph", path:"book-of-wisdom/index.html", desc:"Ancient wisdom for modern living — philosophical insights for navigating life with clarity and purpose.", filter:"philosophy"},
  {id:"13", title:"Daily Robert Greene", author:"Robert Greene", path:"daily-robert-greene/index.html", desc:"366 meditations on power, seduction, mastery, strategy, and human nature.", filter:"power"},
  {id:"14", title:"Mastery", author:"Robert Greene", path:"mastery/index.html", desc:"The lifelong journey of mastering a craft through deliberate practice and perseverance.", filter:"productivity"},
  {id:"15", title:"Read People Like a Book", author:"Patrick King", path:"read-people-like-a-book/index.html", desc:"How to analyze, understand, and predict people's emotions, thoughts, intentions, and behaviors.", filter:"psychology"},
  {id:"16", title:"Rich Dad Poor Dad", author:"Robert Kiyosaki", path:"rich-dad-poor-dad/index.html", desc:"What the rich teach their kids about money — financial literacy, assets vs liabilities, escaping the rat race.", filter:"finance"},
  {id:"17", title:"Surrounded by Idiots", author:"Thomas Erikson", path:"surrounded-by-idiots/index.html", desc:"The four types of human behavior and how to effectively communicate using the DISC framework.", filter:"psychology"},
  {id:"18", title:"Surrounded By Psychopaths", author:"Thomas Erikson", path:"surrounded-by-psychopaths/index.html", desc:"How to identify and protect yourself from psychopathic behavior using the DISC model.", filter:"psychology"},
  {id:"19", title:"The Art of Seduction", author:"Robert Greene", path:"the-art-of-seduction/index.html", desc:"The 9 types of seducers and the timeless strategies of attraction and social influence.", filter:"power"},
  {id:"20", title:"The Concise Laws of Human Nature", author:"Robert Greene", path:"the-concise-laws/index.html", desc:"A condensed guide to the 18 laws of human nature and mastering social dynamics.", filter:"psychology"},
  {id:"21", title:"The Laws of Human Nature", author:"Robert Greene", path:"the-laws-of-human-nature/index.html", desc:"18 deep psychological laws with historical examples for mastering social dynamics.", filter:"psychology"},
  {id:"22", title:"The Millionaire Master Plan", author:"Roger James Hamilton", path:"the-millionaire-master-plan/index.html", desc:"Your personalized path to financial success — discovering your wealth personality type.", filter:"finance"},
  {id:"23", title:"The Prince", author:"Niccolò Machiavelli", path:"the-prince/index.html", desc:"The classic Renaissance treatise on power, leadership, and statecraft.", filter:"power"},
  {id:"24", title:"The Psychology of Money", author:"Morgan Housel", path:"the-psychology-of-money/index.html", desc:"Timeless lessons on wealth, greed, and happiness — the psychology behind financial decisions.", filter:"finance"}
];

let currentFilter = 'all';
let currentSearch = '';

function filterBooks() {
  return BOOKS.filter(b => {
    if (currentFilter !== 'all' && b.filter !== currentFilter) return false;
    if (currentSearch) {
      const s = currentSearch.toLowerCase();
      return b.title.toLowerCase().includes(s) || b.author.toLowerCase().includes(s);
    }
    return true;
  });
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = filterBooks();
  document.getElementById('count').textContent = filtered.length + ' resource' + (filtered.length !== 1 ? 's' : '');
  grid.innerHTML = filtered.map(b => {
    return '<a class="card" data-filter="' + b.filter + '" href="' + b.path + '">' +
      '<div class="card-accent"></div>' +
      '<div class="card-top">' +
        '<h3>' + b.title + '</h3>' +
        '<span class="badge">' + b.filter + '</span>' +
      '</div>' +
      '<div class="author">' + b.author + '</div>' +
      '<div class="desc">' + b.desc + '</div>' +
      '<div class="card-footer">' +
        '<span class="open-hint">Open <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></span>' +
      '</div>' +
    '</a>';
  }).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    render();
  });
});

document.getElementById('search').addEventListener('input', function() {
  currentSearch = this.value;
  render();
});

render();

function loadBgMode() {
  try { const v = localStorage.getItem('nexo_bg_mode'); if (v === 'light' || v === 'dark') return v; } catch(e) {}
  return 'dark';
}
function saveBgMode(mode) { localStorage.setItem('nexo_bg_mode', mode); }
function applyBgMode(mode) {
  const isLight = mode === 'light';
  document.body.classList.toggle('light-mode', isLight);
  const icon = document.getElementById('themeToggleIcon');
  if (icon) {
    icon.innerHTML = isLight
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
}
applyBgMode(loadBgMode());
function toggleBgMode() { const c = loadBgMode(); const n = c === 'light' ? 'dark' : 'light'; saveBgMode(n); applyBgMode(n); }
</script>
</body>
</html>
